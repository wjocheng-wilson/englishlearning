  <script>
    // Audio Context 遊戲音效
    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'wrong') {
          osc.frequency.setValueAtTime(220, ctx.currentTime); // A3
          osc.frequency.setValueAtTime(196, ctx.currentTime + 0.15); // G3
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'click') {
          osc.frequency.setValueAtTime(400, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        }
      } catch (e) {
        console.log("Audio not supported or restricted");
      }
    }

    // 語音朗讀 (TTS)
    let currentSpeechSpeed = 1.0;
    function speakText(text) {
      if (!('speechSynthesis' in window)) {
        alert('您的瀏覽器不支援語音朗讀功能');
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = currentSpeechSpeed;
      window.speechSynthesis.speak(utter);
    }

    function toggleSpeechSpeed() {
      if (currentSpeechSpeed === 1.0) currentSpeechSpeed = 0.7;
      else if (currentSpeechSpeed === 0.7) currentSpeechSpeed = 1.2;
      else currentSpeechSpeed = 1.0;
      
      const btn = document.getElementById('speedToggleBtn');
      if (btn) btn.innerText = `${currentSpeechSpeed}x 語速`;
      playSound('click');
    }

    // ----------------------------------------------------
    // 控制與頁面渲染邏輯
    // ----------------------------------------------------

    // 初始化與加載
    window.addEventListener('DOMContentLoaded', () => {
      refreshDataBatches();
      renderCurrentTab();
      updateHeaderBadges();
    });

    function refreshDataBatches() {
      // 從對應程度隨機取 6 個單字
      const fullList = vocabularyBank[state.level] || vocabularyBank.elementary;
      state.activeWordBatch = shuffleArray([...fullList]).slice(0, 6);
      state.wordDisplayIndex = 0;

      // 隨機選取片語
      const pList = phraseBank[state.level] || phraseBank.elementary;
      state.activePhraseBatch = shuffleArray([...pList]);
    }

    function shuffleArray(arr) {
      return arr.sort(() => Math.random() - 0.5);
    }

    function updateHeaderBadges() {
      const labels = { elementary: "🌱 國小基礎組", junior: "🌿 國中進階組", senior: "🌳 高中精英組" };
      const icons = { elementary: "🌱", junior: "🌿", senior: "🌳" };
      const texts = { elementary: "國小", junior: "國中", senior: "高中" };

      document.getElementById('currentLevelLabel').innerText = labels[state.level];
      document.getElementById('levelBadgeIcon').innerText = icons[state.level];
      document.getElementById('levelBadgeText').innerText = texts[state.level];

      document.getElementById('starCounter').innerText = state.stars;
      document.getElementById('streakCounter').innerText = state.streak;

      // 更新書籤數量
      const badge = document.getElementById('bookmarkCountBadge');
      if (state.bookmarks.length > 0) {
        badge.innerText = state.bookmarks.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      // 儲存進度
      localStorage.setItem('emily_stars', state.stars);
      localStorage.setItem('emily_bookmarks', JSON.stringify(state.bookmarks));
    }

    // 切換分頁
    function switchTab(tabName) {
      state.tab = tabName;
      playSound('click');

      // 更新 nav 樣式
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-teal-600');
        btn.classList.add('text-slate-400');
      });
      const activeNav = document.getElementById(`nav-${tabName}`);
      if (activeNav) {
        activeNav.classList.remove('text-slate-400');
        activeNav.classList.add('text-teal-600');
      }

      renderCurrentTab();
    }

    // 主內容渲染
    function renderCurrentTab() {
      const main = document.getElementById('mainContent');

      if (state.tab === 'words') {
        renderWordsView(main);
      } else if (state.tab === 'phrases') {
        renderPhrasesView(main);
      } else if (state.tab === 'grammar') {
        renderGrammarView(main);
      } else if (state.tab === 'skills') {
        renderSkillsView(main);
      } else if (state.tab === 'game') {
        renderGameView(main);
      } else if (state.tab === 'quiz') {
        renderQuizView(main);
      }
    }

    // ----------------------------------------------------

                  <p class="text-teal-200">${w.szh}</p>

    function flipCard(el) {
      el.classList.toggle('card-flipped');
      playSound('click');
    }

    function nextWord() {
      state.wordDisplayIndex = (state.wordDisplayIndex + 1) % state.activeWordBatch.length;
      playSound('click');
      renderCurrentTab();
    }

    function prevWord() {
      state.wordDisplayIndex = (state.wordDisplayIndex - 1 + state.activeWordBatch.length) % state.activeWordBatch.length;
      playSound('click');
      renderCurrentTab();
    }

    function refreshWordsBatch() {
      refreshDataBatches();
      playSound('click');
      renderCurrentTab();
    }

    function toggleBookmark(encodedObj) {
      const wordObj = JSON.parse(decodeURIComponent(encodedObj));
      const idx = state.bookmarks.findIndex(item => item.word === wordObj.word);
      if (idx >= 0) {
        state.bookmarks.splice(idx, 1);
      } else {
        state.bookmarks.push(wordObj);
      }
      updateHeaderBadges();
      renderCurrentTab();
    }

                  `).join('')}

            `).join('')}
          </div>

    function checkGrammarAns(btn, selected, correct) {
      if (selected === correct) {
        btn.className = "py-2 bg-emerald-500 text-white rounded-xl text-xs font-bold active:scale-95 transition shadow-md";
        playSound('correct');
        state.stars += 2;
        updateHeaderBadges();
      } else {
        btn.className = "py-2 bg-rose-500 text-white rounded-xl text-xs font-bold active:scale-95 transition";
        playSound('wrong');
      }
    }

            <span class="text-xs bg-rose-100 text-rose-700 px-2.5 py-0.5 rounded-md font-bold">口說特訓</span>
            <p class="text-xs text-slate-500 mt-1 mb-2">請朗讀以下單字：</p>
            <h3 class="text-2xl font-extrabold text-slate-800 mb-3">${target.word}</h3>
            
            <button onclick="simulateSpeechRec('${target.word}')" class="bg-rose-500 text-white px-5 py-2.5 rounded-full text-xs font-bold shadow-md flex items-center justify-center gap-2 mx-auto active:scale-95 transition">
              <i class="fa-solid fa-microphone"></i> 點擊開始發音比對
            </button>
            <div id="speechFeedback" class="mt-2 text-xs font-bold min-h-[1.25rem]"></div>
          </div>
        </div>
      `;
    }

    function checkSkillAns(btn, selected, correct) {
      if (selected === correct) {
        btn.className = "py-2.5 bg-emerald-500 text-white rounded-xl text-xs font-bold shadow-md";
        playSound('correct');
        state.stars += 3;
        updateHeaderBadges();
      } else {
        btn.className = "py-2.5 bg-rose-500 text-white rounded-xl text-xs font-bold";
        playSound('wrong');
      }
    }

    function simulateSpeechRec(targetWord) {
      const feedback = document.getElementById('speechFeedback');
      feedback.className = "mt-2 text-xs font-bold text-amber-600";
      feedback.innerText = "聆聽中...請朗讀 " + targetWord;

      setTimeout(() => {
        feedback.className = "mt-2 text-xs font-bold text-emerald-600";
        feedback.innerText = "🎉 發音非常標準！綜合評分：98 分！";
        playSound('correct');
        state.stars += 5;
        updateHeaderBadges();
      }, 1500);
    }

    // ----------------------------------------------------
    // Tab 5: 🧩 單字消消樂 (Match Game)
    // ----------------------------------------------------
    function renderGameView(container) {
      if (state.gameCards.length === 0) {
        initMatchGame();
      }

      container.innerHTML = `
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-bold text-slate-800 text-base flex items-center gap-2">
            <i class="fa-solid fa-gamepad text-teal-500"></i> 單字翻牌消消樂
          </h2>
          <button onclick="initMatchGame(); renderCurrentTab();" class="text-xs bg-teal-100 text-teal-800 px-2.5 py-1 rounded-full font-bold">
            🔄 重來一局
          </button>
        </div>

        <div class="grid grid-cols-3 gap-2.5">
          ${state.gameCards.map((card, idx) => `
            <button onclick="flipGameCard(${idx})" class="h-20 rounded-2xl font-bold text-xs p-2 flex items-center justify-center text-center transition shadow-sm ${
              card.matched 
                ? 'bg-slate-100 text-slate-300 border-none' 
                : card.flipped 
                  ? 'bg-teal-500 text-white shadow-md' 
                  : 'bg-white text-slate-700 border border-slate-200 active:scale-95'
            }">
              ${card.flipped || card.matched ? card.text : '❓'}
            </button>
          `).join('')}
        </div>
      `;
    }

    function initMatchGame() {
      const pool = vocabularyBank[state.level];
      const selected = shuffleArray([...pool]).slice(0, 4); // 4對 = 8張牌
      let cards = [];

      selected.forEach((item, id) => {
        cards.push({ id, text: item.word, type: 'en', flipped: false, matched: false });
        cards.push({ id, text: item.zh, type: 'zh', flipped: false, matched: false });
      });

      state.gameCards = shuffleArray(cards);
      state.gameFlippedCards = [];
      state.gameMatchedPairs = 0;
    }

    function flipGameCard(index) {
      const card = state.gameCards[index];
      if (card.flipped || card.matched || state.gameFlippedCards.length >= 2) return;

      card.flipped = true;
      playSound('click');
      state.gameFlippedCards.push({ index, card });

      if (state.gameFlippedCards.length === 2) {
        const [first, second] = state.gameFlippedCards;
        if (first.card.id === second.card.id && first.card.type !== second.card.type) {
          // 配對成功
          setTimeout(() => {
            first.card.matched = true;
            second.card.matched = true;
            state.gameFlippedCards = [];
            state.gameMatchedPairs++;
            playSound('correct');
            state.stars += 5;
            updateHeaderBadges();

            if (state.gameMatchedPairs === 4) {
              alert('🎉 恭喜通關消消樂！獲得 20 顆星星獎勵！');
              state.stars += 20;
              updateHeaderBadges();
            }
            renderCurrentTab();
          }, 400);
        } else {
          // 配對失敗
          setTimeout(() => {
            first.card.flipped = false;
            second.card.flipped = false;
            state.gameFlippedCards = [];
            playSound('wrong');
            renderCurrentTab();
          }, 800);
        }
      }
      renderCurrentTab();
    }

    // ----------------------------------------------------
    // Tab 6: 🏆 綜合測驗與證書 (Quiz)
    // ----------------------------------------------------
    function renderQuizView(container) {
      const words = vocabularyBank[state.level];
      const quizQuestions = shuffleArray([...words]).slice(0, 5);

      container.innerHTML = `
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
          <div class="text-center mb-5">
            <div class="w-12 h-12 rounded-full bg-amber-100 text-amber-500 flex items-center justify-center text-2xl mx-auto mb-2">🏆</div>
            <h2 class="font-extrabold text-slate-800 text-base">綜合能力檢定測驗</h2>
            <p class="text-xs text-slate-500">測驗包含單字與釋義配對，完成可獲榮譽證書</p>
          </div>

          <div class="space-y-4">
            ${quizQuestions.map((item, idx) => `
              <div class="p-3 bg-slate-50 rounded-2xl">
                <p class="text-xs font-bold text-slate-800 mb-2">${idx + 1}. 請選出 "${item.word}" 的正確中文釋義：</p>
                <div class="grid grid-cols-2 gap-2">
                  ${shuffleArray([item.zh, "學校", "機會", "快樂"]).map(opt => `
                    <button onclick="checkQuizItem(this, '${opt}', '${item.zh}')" class="py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-700 active:scale-95 transition">
                      ${opt}
                    </button>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>

          <button onclick="finishQuiz()" class="w-full mt-6 py-3 bg-emerald-500 text-white rounded-2xl font-bold text-sm shadow-md active:scale-95 transition">
            完成測驗並領取證書
          </button>
        </div>
      `;
    }

    function checkQuizItem(btn, selected, correct) {
      if (selected === correct) {
        btn.className = "py-2 bg-emerald-500 text-white rounded-xl text-xs font-bold shadow-md";
        playSound('correct');
      } else {
        btn.className = "py-2 bg-rose-500 text-white rounded-xl text-xs font-bold";
        playSound('wrong');
      }
    }

    function finishQuiz() {
      playSound('correct');
      state.stars += 30;
      updateHeaderBadges();
      alert('🏆 恭喜您完成綜合測驗！獲得 A+ 優秀榮譽證書與 30 顆星星獎勵！');
    }

    // ----------------------------------------------------
    // 收藏庫彈出視窗
    // ----------------------------------------------------
    function openBookmarksModal() {
      const modal = document.getElementById('bookmarksModal');
      const list = document.getElementById('bookmarksList');

      if (state.bookmarks.length === 0) {
        list.innerHTML = `<p class="text-xs text-slate-400 text-center py-8">目前尚未收藏任何單字卡喔！</p>`;
      } else {
        list.innerHTML = state.bookmarks.map(item => `
          <div class="p-3 bg-slate-50 rounded-2xl flex items-center justify-between">
            <div>
              <div class="font-bold text-sm text-slate-800">${item.word}</div>
              <div class="text-xs text-slate-500">${item.zh}</div>
            </div>
            <button onclick="speakText('${item.word}')" class="w-8 h-8 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center text-xs">
              <i class="fa-solid fa-volume-high"></i>
            </button>
          </div>
        `).join('');
      }

      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    function closeBookmarksModal() {
      const modal = document.getElementById('bookmarksModal');
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    // ----------------------------------------------------
    // 程度 Bottom Sheet 控制
    // ----------------------------------------------------
    function openLevelSheet() {
      const modal = document.getElementById('levelModal');
      const content = document.getElementById('levelModalContent');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        content.classList.remove('translate-y-full');
      }, 10);
    }

    function closeLevelSheet() {
      const modal = document.getElementById('levelModal');
      const content = document.getElementById('levelModalContent');
      content.classList.add('translate-y-full');
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    function selectLevel(lvl) {
      state.level = lvl;
      playSound('click');

      // 更新 modal 按鈕邊框
      ['elementary', 'junior', 'senior'].forEach(l => {
        const btn = document.getElementById(`btn-lvl-${l}`);
        if (l === lvl) {
          btn.className = "w-full p-4 rounded-2xl border-2 border-teal-500 bg-teal-50 flex items-center justify-between transition";
        } else {
          btn.className = "w-full p-4 rounded-2xl border-2 border-slate-200 flex items-center justify-between transition";
        }
      });

      refreshDataBatches();
      initMatchGame();
      updateHeaderBadges();
      renderCurrentTab();
      closeLevelSheet();
    }
  </script>
</body>
</html>
